# Roadrunner CI (Woodpecker + Dagger, https://cicd.apps.example.com): port of .github/workflows/ci.yml — Node 22 + Bun 1.4.4 (was "latest"): npm install, contracts codegen drift check, build, typecheck, bun tests.
# `npm install` (not `npm ci`, as the workflow): container-run on node:22 pinned by digest.
# `$$` escapes `$` for Woodpecker. Docs: https://cicd.docs.example.com/roadrunner/
labels:
  tier: "0"
when:
  - event: pull_request
  - event: [push, manual]
    branch: main
steps:
  - name: test
    image: bash
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.0.2.1:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - >-
        ci-runner v0.10.1 container-run --src=. --repo="$${CI_REPO_NAME,,}" --shell=bash
        --image=public.ecr.aws/docker/library/node:22-bookworm-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
        --apt=git,ca-certificates
        --env=npm_config_registry=https://npm.dev.example.com/,NPM_CONFIG_UPDATE_NOTIFIER=false
        --run='npm install -g bun@1.4.4 && timeout 900 npm install --no-audit --no-fund && npm run gen:check --workspace packages/contracts && npm run build && npm run typecheck && npm test'
        --test-workers=2
