# Roadrunner release (Woodpecker + Dagger, https://cicd.apps.example.com): port of
# .github/workflows/release.yml. A pushed per-package tag `<pkg>-vX.Y.Z` subtree-splits
# packages/<pkg> into the branch release/<tag> (a flat package root, so npm git installs
# work), pushes that branch, force-moves the tag to the split commit, then smoke-installs
# `github:<repo>#<tag>` with npm inside ci-runner (node 22, pinned by digest).
# Host git runs as exowatt-woodpecker-bot (repo secret github_release_token, tag events).
# Loop guard: the force-pushed tag fires its own tag event, at the split commit. That tree has
# no packages/ dir (and no .woodpecker/), so `release` exits 0 without pushing anything and only
# the smoke install runs again. No GitHub step summary (GitHub-only): the log says what moved.
# `$$` escapes `$` for Woodpecker. Docs: https://cicd.docs.example.com/roadrunner/
labels:
  tier: "0"
when:
  - event: tag
    ref:
      - refs/tags/kicad-parsers-v*
      - refs/tags/rendering-core-v*
      - refs/tags/kicad-import-v*
      - refs/tags/step-to-glb-v*
      - refs/tags/r3f-eda-canvas-v*
      - refs/tags/opclib-pack-v*
      - refs/tags/command-pattern-v*
      - refs/tags/contracts-v*
      - refs/tags/ai-core-v*
steps:
  - name: release
    image: bash
    environment:
      GH_TOKEN:
        from_secret: github_release_token
    commands:
      - |
        set -eu
        export GIT_TERMINAL_PROMPT=0
        TAG="$$CI_COMMIT_TAG"
        PACKAGE="$${TAG%-v*}"
        VERSION="$${TAG##*-v}"
        BRANCH="release/$$TAG"
        if [ ! -d packages ] && grep -q "\"name\": \"@openpcb/$$PACKAGE\"" package.json; then
          echo "$$TAG already points at a subtree-split commit ($$CI_COMMIT_SHA): nothing to split or push"
          exit 0
        fi
        if [ ! -d "packages/$$PACKAGE" ]; then
          echo "ERROR: packages/$$PACKAGE not found for tag $$TAG" >&2
          exit 1
        fi
        REMOTE="https://x-access-token:$$GH_TOKEN@github.com/$$CI_REPO.git"
        if [ "$$(git rev-parse --is-shallow-repository)" = true ]; then
          timeout 600 git fetch --quiet --unshallow "$$REMOTE" "$$CI_COMMIT_SHA"
        fi
        G="git -c user.name=exowatt-woodpecker-bot -c user.email=exowatt-woodpecker-bot@users.noreply.github.com"
        timeout 900 $$G subtree split --prefix="packages/$$PACKAGE" -b "$$BRANCH"
        SPLIT="$$(git rev-parse "$$BRANCH")"
        timeout 300 git push --quiet -f "$$REMOTE" "refs/heads/$$BRANCH:refs/heads/$$BRANCH"
        git tag -f "$$TAG" "$$SPLIT"
        timeout 300 git push --quiet -f "$$REMOTE" "refs/tags/$$TAG"
        echo "released @openpcb/$$PACKAGE $$VERSION: $$TAG -> $$SPLIT (branch $$BRANCH); install: github:$$CI_REPO#$$TAG"
  - name: install-smoke
    image: bash
    depends_on: [release]
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.0.2.1:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - >-
        ci-runner v0.10.1 container-run --src=. --repo="$${CI_REPO_NAME,,}" --shell=bash
        --image=public.ecr.aws/docker/library/node:22-bookworm-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
        --apt=git,ca-certificates
        --env="npm_config_registry=https://npm.dev.example.com/,NPM_CONFIG_UPDATE_NOTIFIER=false,SPEC=github:$$CI_REPO#$$CI_COMMIT_TAG,PKG=$${CI_COMMIT_TAG%-v*}"
        --run='mkdir -p /tmp/install-smoke && cd /tmp/install-smoke && npm init -y >/dev/null && timeout 600 npm install "$$SPEC" --no-save --silent && ls -la "node_modules/@openpcb/$$PKG/dist" | head -5'
        --test-workers=2
